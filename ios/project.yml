name: Commz
options:
  bundleIdPrefix: net.commz
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.35.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    ENABLE_BITCODE: NO

targets:
  Commz:
    type: application
    platform: iOS
    sources:
      - path: Commz/Sources
      - path: Commz/Resources
      - path: Commz/Info.plist
        buildPhase: none
    settings:
      base:
        PRODUCT_NAME: Commz
        PRODUCT_BUNDLE_IDENTIFIER: net.commz.app
        INFOPLIST_FILE: Commz/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: NO
        CLANG_ENABLE_MODULES: YES
        # CI builds unsigned and the IPA is re-signed by the sideloading tool.
        # Override these on a developer machine to run on a device from Xcode.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""

schemes:
  Commz:
    build:
      targets:
        Commz: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
